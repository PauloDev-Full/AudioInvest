services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: investment
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d investment"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
